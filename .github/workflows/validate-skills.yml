name: Validate skills

on:
  pull_request:
    paths:
      - "pstack/**"
      - "cursor-origin/cursor-team-kit/skills/**"
      - "cursor-origin/scripts/check-pstack-docs.mjs"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-save --package-lock=false fast-check@4.5.3

      - name: Check pstack documentation
        run: node cursor-origin/scripts/check-pstack-docs.mjs

      - name: Test pstack skill scripts
        run: node --disable-warning=ExperimentalWarning --test pstack/skills/*/scripts/test/*.test.ts
